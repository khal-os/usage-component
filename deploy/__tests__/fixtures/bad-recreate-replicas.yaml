# INVALIDA DE PROPOSITO — singleton com mais de uma replica.
#
# O `billing-close-scheduler` declara `strategy: Recreate` em deploy/values.yaml:
# e um reconciliador SEM LEASE. Duas replicas fecham o mesmo mes duas vezes
# (PLANO §7, risco 3) — e `Recreate` nao impede nada disso: ele so ordena
# morte-antes-de-nascimento. (A mesma regra valia para o `trace-ingestion-worker`,
# removido em 2026-11-27 com o descomissionamento do LangWatch.)
#
# Antes desta regra o chart renderizava `replicas: 3` calado, e o PDB ainda
# "degradava" sozinho de singleton para multi-replica. Quem reprova agora e a
# schema, antes de qualquer cluster ver o manifesto.
services:
  billing-close-scheduler:
    replicas: 3
