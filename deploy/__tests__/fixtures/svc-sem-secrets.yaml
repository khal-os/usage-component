# VALIDA — um servico SEM `secrets:`. Existe para provar que o chart generico do
# Padrao (CONTRATO §5) nao falha ABERTO nesse caso: sem paths declarados nao ha
# ExternalSecret, logo nao pode haver `envFrom` de um Secret que ninguem cria
# (o pod ficaria em CreateContainerConfigError para sempre) nem annotation do
# Reloader apontando para ele. Nenhum dos 5 workloads deste repo cai neste caso
# — e por isso mesmo o teste existe.
services:
  probe-sem-secrets:
    enabled: true
    group: components
    image:
      name: usage-module
      repository: 278522730053.dkr.ecr.sa-east-1.amazonaws.com/kos/usage-module
    command: ["node", "-e", "setInterval(() => {}, 1000)"]
    replicas: 1
    preset: S
    secrets: []
    health:
      readiness:
        command: ["true"]
