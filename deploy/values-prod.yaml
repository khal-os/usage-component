# ═══════════════════════════════════════════════════════════════════════════════
# PROD — cluster `hapvida-prod` (conta 652197205677), namespace `kos-components`
# Branch do ambiente: `main` (hoje `eks/main`).
# O pin daqui e escrito pela lane de promocao, que LE o bloco `pins` de
# `origin/eks/homolog:deploy/values-hml.yaml`. Nada e reconstruido: o binario de
# producao e bit-a-bit o que homolog validou.
# ═══════════════════════════════════════════════════════════════════════════════

common:
  environment: prod

externalSecrets:
  storeName: hapvida-prod

secretsPathPrefix: /hapvida/prod/kos/components

ingressDefaults:
  groupName: hapvida-prod

# Subnets do ALB do grupo hapvida-prod (VPC 10.72.0.0/16).
albSubnetCidrs:
  - 10.72.240.0/24
  - 10.72.241.0/24
  - 10.72.242.0/24

extraEgress:
  - cidr: 10.72.0.0/16
    ports:
      - { protocol: TCP, port: 27017 }
      - { protocol: TCP, port: 1024, endPort: 65535 }

# ── Pins (ESCRITO POR deploy/gitops-pin.sh — nao editar a mao) ────────────────
pins:
  usage-module:
    digest: "sha256:0cbe68ca123569d4d40e17c537ad39472eb7bda4a1a9d9c0a1be9f3c13e484f0"
    gitSha: "0db5b43ea692c42b17b8bf59181c400ff0b5cee1"
  usage-connector:
    digest: "sha256:324d35541248cb75cc46ad1ef947e5afce035d98dd9d9a55fc0454a5a321d64f"
    gitSha: "0db5b43ea692c42b17b8bf59181c400ff0b5cee1"
  usage-db-backup:
    digest: "sha256:badba2ee61789848cc281eacb393a9868218fdf7b074c15814b051d1e857eec2"
    gitSha: "0db5b43ea692c42b17b8bf59181c400ff0b5cee1"

services:
  api:
    # 2 replicas: unico servico stateless do chart. maxSurge 1 / maxUnavailable 0
    # + PDB maxUnavailable 1 mantem a API no ar durante rollout e drain.
    replicas: 2
    ingress:
      # HOST DE VALIDACAO (ate o cutover): a POC segue dona de api.hapvida e
      # auth.hapvida; o prod novo valida em paralelo pela familia `-prod`,
      # casada com o values-prod do khal-platform. No cutover, os tres valores
      # abaixo (host, KHAL_AUTH_URL, primeira origem do CORS) trocam pro nome
      # final — hapvida vs martechos, decisao pendente do owner.
      host: api-prod.hapvida.khal.ai
    envOverride:
      ENVIRONMENT: production
      MONGO_USAGE_DB_NAME: usage_db
      KHAL_AUTH_URL: https://auth-prod.hapvida.khal.ai
      CORS_ALLOWED_ORIGINS: https://hapvida-prod.khal.ai,https://*.hapvida.khal.ai

  trace-ingestion-worker:
    envOverride:
      ENVIRONMENT: production
      MONGO_USAGE_DB_NAME: usage_db
      LANGWATCH_CLICKHOUSE_URL: http://clickhouse.kos-langwatch.svc.cluster.local:8123
    extraEgress:
      - namespace: kos-langwatch
        ports:
          - { protocol: TCP, port: 8123 }

  billing-close-scheduler:
    envOverride:
      ENVIRONMENT: production
      MONGO_USAGE_DB_NAME: usage_db

jobs:
  migrations:
    envOverride:
      ENVIRONMENT: production
      MONGO_USAGE_DB_NAME: usage_db

cronjobs:
  backup:
    serviceAccount:
      irsaRoleArn: arn:aws:iam::652197205677:role/hv-kos-usage-backup-prod
    envOverride:
      MONGO_USAGE_DB_NAME: usage_db
      # RECONCILIADO 2026-08-23 (RECONCILIATION.md, topico 2): o nome CANONICO
      # do bucket e `hv-kos-usage-backups-<env>` — PLURAL. Nao e escolha de
      # gosto: e o nome que o `aws_s3_bucket` do modulo `kos-client-foundation`
      # (khal-infra, stream A) cria, provado no `tofu plan` (`BUCKET
      # hv-kos-usage-backups-<env>`), e e o unico ARN que a policy da role
      # `hv-kos-usage-backup-<env>` autoriza. Com o singular, o CronJob subiria
      # com a credencial certa e levaria AccessDenied num bucket que nao existe.
      # (A ROLE segue no singular `hv-kos-usage-backup-<env>`: e outro nome,
      # noutro namespace da AWS, e quem manda nele tambem e o Tofu.)
      BACKUP_BUCKET: hv-kos-usage-backups-prod
