{{- /*
Service ClusterIP so para servico que EXPOE porta. Worker e scheduler nao expoem
nada: um Service sem endpoint util e um alvo de debug que engana.
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.port }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kos.name" $ctx }}
  namespace: {{ include "kos.namespace" $ }}
  labels:
    {{- include "kos.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kos.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.servicePort | default $svc.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
