{{- /*
UM ExternalSecret por workload, com N `extract` (um por path declarado em
`secrets:`). CONTRATO §4:
  · os 4 defaults do CRD sao EXPLICITOS — o Argo diffa contra o objeto ja
    defaultado pelo CRD e, sem eles, o ExternalSecret fica OutOfSync para sempre;
  · `creationPolicy: Owner` + `deletionPolicy: Retain` — adota Secret existente
    in-place (sem janela) e nao apaga o Secret se o ES sumir;
  · "point, don't copy": paths compartilhados (ex.: /kos/components/mongo, lido
    pela api, pelo worker, pelo scheduler, pela migracao e pelo backup) sao
    REFERENCIADOS por varios ExternalSecrets, nunca duplicados no SM.
O chart nunca renderiza `kind: Secret`.
*/ -}}
{{- define "kos.externalSecret" -}}
{{- $root := .root -}}
{{- $name := .name -}}
{{- $spec := .spec -}}
{{- $ctx := dict "root" $root "name" $name "svc" $spec -}}
{{- if $spec.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "kos.name" $ctx }}-env
  namespace: {{ include "kos.namespace" $root }}
  labels:
    {{- include "kos.labels" $ctx | nindent 4 }}
spec:
  refreshInterval: {{ $root.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $root.Values.externalSecrets.storeKind }}
    name: {{ required "externalSecrets.storeName e obrigatorio (ClusterSecretStore do cluster)" $root.Values.externalSecrets.storeName }}
  target:
    name: {{ include "kos.envSecretName" $ctx }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    {{- range (include "kos.secretPaths" (dict "root" $root "spec" $spec) | fromYamlArray) }}
    - extract:
        key: {{ . | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
{{- end -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- include "kos.externalSecret" (dict "root" $ "name" $name "spec" $svc) }}
{{- range $svc.sidecars }}
{{- if .secrets }}
{{- include "kos.externalSecret" (dict "root" $ "name" (printf "%s-%s" $name .name) "spec" .) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $name, $job := .Values.jobs }}
{{- if $job.enabled }}
{{- include "kos.externalSecret" (dict "root" $ "name" $name "spec" $job) }}
{{- end }}
{{- end }}
{{- range $name, $cj := .Values.cronjobs }}
{{- if $cj.enabled }}
{{- include "kos.externalSecret" (dict "root" $ "name" $name "spec" $cj) }}
{{- end }}
{{- end }}
