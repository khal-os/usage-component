{{- /*
UM ExternalSecret por workload, com N `extract` (um por path declarado em
`secrets:`). CONTRATO §4:
  · os 4 defaults do CRD sao EXPLICITOS — o Argo diffa contra o objeto ja
    defaultado pelo CRD e, sem eles, o ExternalSecret fica OutOfSync para sempre;
  · `creationPolicy: Owner` + `deletionPolicy: Retain` — adota Secret existente
    in-place (sem janela) e nao apaga o Secret se o ES sumir;
  · "point, don't copy": paths compartilhados (ex.: /kos/components/mongo, lido
    pela api, pelo worker, pelo scheduler, pela migracao e pelo backup) sao
    REFERENCIADOS por varios ExternalSecrets, nunca duplicados no SM.
O chart nunca renderiza `kind: Secret`.

── ORDEM: o ExternalSecret de um Job de HOOK e, ele proprio, um hook ───────────
Um `Job` PreSync roda na FASE PreSync; um ExternalSecret comum e recurso da fase
SYNC, que so comeca DEPOIS que os hooks PreSync terminaram. Logo, no primeiro
sync de um ambiente, o Job de migracao subia com `envFrom` de um Secret que
ainda nao existia — e nunca existiria a tempo: o pod fica em
`CreateContainerConfigError` ate `activeDeadlineSeconds` (600 s), o Job falha, a
fase PreSync falha e o sync inteiro para. Nao e flake, e deadlock de fase.
Correcao: o ES do Job entra na MESMA fase do Job, numa sync-wave ANTERIOR
(ES -1, Job 0) — o Argo so avanca de wave quando a anterior esta saudavel, e o
Argo CD tem health check nativo para `external-secrets.io/ExternalSecret`
(condicao `Ready`), entao a wave 0 so abre com o Secret materializado.
`creationPolicy: Orphan` NESTE caso (e so nele): com `Owner`, o ESO poe
ownerReference no Secret, e `hook-delete-policy: BeforeHookCreation` — que e o
padrao, e o que se quer, para o objeto do sync anterior ficar legivel ate o
proximo — apagaria o ES e, por cascata, o proprio Secret que o Job precisa ler.
Com `Orphan` a delecao do hook nunca alcanca o Secret: ele sobrevive entre
syncs, continua sendo atualizado pelo ESO enquanto o ES existe, e o Job encontra
credencial valida mesmo se o ESO estiver indisponivel no instante do sync.
O preco (registrado como follow-up) e que esse Secret nao e coletado junto com a
Application; some com o namespace. Os ExternalSecrets de Deployment/CronJob
continuam `Owner`, sem hook e sem wave.
*/ -}}
{{- define "kos.externalSecret" -}}
{{- $root := .root -}}
{{- $name := .name -}}
{{- $spec := .spec -}}
{{- $hook := .hook | default dict -}}
{{- $creationPolicy := .creationPolicy | default "Owner" -}}
{{- $ctx := dict "root" $root "name" $name "svc" $spec -}}
{{- if $spec.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "kos.name" $ctx }}-env
  namespace: {{ include "kos.namespace" $root }}
  labels:
    {{- include "kos.labels" $ctx | nindent 4 }}
  {{- if $hook.phase }}
  annotations:
    argocd.argoproj.io/hook: {{ $hook.phase }}
    argocd.argoproj.io/hook-delete-policy: {{ $hook.deletePolicy | default "BeforeHookCreation" }}
    argocd.argoproj.io/sync-wave: {{ $hook.wave | toString | quote }}
  {{- end }}
spec:
  refreshInterval: {{ $root.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $root.Values.externalSecrets.storeKind }}
    name: {{ required "externalSecrets.storeName e obrigatorio (ClusterSecretStore do cluster)" $root.Values.externalSecrets.storeName }}
  target:
    name: {{ include "kos.envSecretName" $ctx }}
    creationPolicy: {{ $creationPolicy }}
    deletionPolicy: Retain
  dataFrom:
    {{- range (include "kos.secretPaths" (dict "root" $root "spec" $spec) | fromYamlArray) }}
    - extract:
        key: {{ . | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
{{- end -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- include "kos.externalSecret" (dict "root" $ "name" $name "spec" $svc) }}
{{- range $svc.sidecars }}
{{- if .secrets }}
{{- include "kos.externalSecret" (dict "root" $ "name" (printf "%s-%s" $name .name) "spec" .) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $name, $job := .Values.jobs }}
{{- if $job.enabled }}
{{- $fase := $job.hook | default "PreSync" }}
{{- /* `default` do sprig trata 0 como vazio: `0 | default -1` devolve -1. Numa
       wave, 0 e um valor legitimo (e o default do Argo), entao a leitura e por
       `hasKey` — senao uma wave 0 declarada a mao viraria outra coisa em
       silencio, que e exatamente o tipo de erro que este bloco existe para
       impedir. */}}
{{- $waveJob := 0 }}
{{- if hasKey $job "syncWave" }}{{- $waveJob = int $job.syncWave }}{{- end }}
{{- $waveEs := sub $waveJob 1 }}
{{- if hasKey $job "esSyncWave" }}{{- $waveEs = int $job.esSyncWave }}{{- end }}
{{- if ge $waveEs $waveJob }}
{{- fail (printf "job '%s': a sync-wave do ExternalSecret (%d) tem de ser MENOR que a do Job (%d) — senao o hook sobe antes do Secret existir e o pod trava em CreateContainerConfigError ate o activeDeadlineSeconds" $name $waveEs $waveJob) }}
{{- end }}
{{- include "kos.externalSecret" (dict "root" $ "name" $name "spec" $job "creationPolicy" "Orphan" "hook" (dict "phase" $fase "wave" $waveEs "deletePolicy" ($job.hookDeletePolicy | default "BeforeHookCreation"))) }}
{{- end }}
{{- end }}
{{- range $name, $cj := .Values.cronjobs }}
{{- if $cj.enabled }}
{{- include "kos.externalSecret" (dict "root" $ "name" $name "spec" $cj) }}
{{- end }}
{{- end }}
