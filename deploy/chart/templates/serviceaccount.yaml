{{- /*
Uma SA por workload. Sem IRSA ela e so identidade (token nem e montado); com
`serviceAccount.irsaRoleArn` ela e a credencial AWS do pod — a unica forma de dar
S3/CloudWatch ao backup sem chave estatica em Secret.
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kos.name" $ctx }}
  namespace: {{ include "kos.namespace" $ }}
  labels:
    {{- include "kos.labels" $ctx | nindent 4 }}
  {{- with ($svc.serviceAccount | default dict).irsaRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- range $name, $job := .Values.jobs }}
{{- if $job.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $job }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kos.name" $ctx }}
  namespace: {{ include "kos.namespace" $ }}
  labels:
    {{- include "kos.labels" $ctx | nindent 4 }}
  {{- /* A SA de um Job de HOOK entra na MESMA fase do Job, numa wave ANTERIOR
     (SA/ES -1, Job 0) — mesmo raciocinio do ExternalSecret: como recurso da
     fase Sync ela nao existiria quando o hook PreSync roda, e o job-controller
     para em FailedCreate ("serviceaccount not found") ate o deadline. Diferente
     do Secret, recriar a SA a cada sync e inocuo, entao BeforeHookCreation. */}}
  annotations:
    argocd.argoproj.io/hook: {{ $job.hook | default "PreSync" }}
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
    {{- with ($job.serviceAccount | default dict).irsaRoleArn }}
    eks.amazonaws.com/role-arn: {{ . | quote }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- range $name, $cj := .Values.cronjobs }}
{{- if $cj.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $cj }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kos.name" $ctx }}
  namespace: {{ include "kos.namespace" $ }}
  labels:
    {{- include "kos.labels" $ctx | nindent 4 }}
  {{- /* IRSA: a credencial do backup (PutObject no prefixo do cliente +
     cloudwatch:PutMetricData) chega por token OIDC projetado, nao por chave.
     O token projetado vem do webhook do EKS e NAO depende do automount do
     token da API do k8s — nenhum workload deste chart fala com a API. */}}
  {{- with ($cj.serviceAccount | default dict).irsaRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
