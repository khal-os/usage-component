# ═══════════════════════════════════════════════════════════════════════════════
# HML — cluster `hapvida-dev` (conta 701016785827), namespace `kos-components-hml`
# Branch do ambiente: `homolog` (hoje `eks/homolog`).
# O pin daqui e escrito pela lane de promocao, que LE o bloco `pins` de
# `origin/eks/dev:deploy/values-dev.yaml` — mesmo digest, zero rebuild.
# ═══════════════════════════════════════════════════════════════════════════════

common:
  environment: hml

externalSecrets:
  # Mesmo ClusterSecretStore de dev: hapvida-dev e do CLUSTER, e dev e hml
  # coabitam na conta 701.
  storeName: hapvida-dev

secretsPathPrefix: /hapvida/hml/kos/components

ingressDefaults:
  groupName: hapvida-hml

albSubnetCidrs:
  - 10.70.240.0/24
  - 10.70.241.0/24

extraEgress:
  - cidr: 10.70.0.0/16
    ports:
      - { protocol: TCP, port: 27017 }
      - { protocol: TCP, port: 1024, endPort: 65535 }

# ── Pins (ESCRITO POR deploy/gitops-pin.sh — nao editar a mao) ────────────────
pins:
  usage-module:
    digest: "sha256:66a7bc0b498cd775884e9ae7abda0618b18379616f597d5630572854d97cd81f"
    gitSha: "c1509a4c6c394d98c9556dae8e241e194eb7726c"
  usage-connector:
    digest: "sha256:539beb3a3671b409a7ca0d08c58c0d3f13145edc85a2050007034b2a79938553"
    gitSha: "c1509a4c6c394d98c9556dae8e241e194eb7726c"
  usage-db-backup:
    digest: "sha256:cfe9d3938313f72cdbb6677e4f13772cdfa1874c530cb744b8f96b031635eb52"
    gitSha: "c1509a4c6c394d98c9556dae8e241e194eb7726c"

services:
  api:
    replicas: 1
    ingress:
      host: api-hml.hapvida.khal.ai
    envOverride:
      ENVIRONMENT: homolog
      MONGO_USAGE_DB_NAME: usage_db
      KHAL_AUTH_URL: https://auth-hml.hapvida.khal.ai
      CORS_ALLOWED_ORIGINS: https://hapvida-hml.khal.ai,https://*.hapvida.khal.ai

  trace-ingestion-worker:
    envOverride:
      ENVIRONMENT: homolog
      MONGO_USAGE_DB_NAME: usage_db
      LANGWATCH_CLICKHOUSE_URL: http://clickhouse.kos-langwatch-hml.svc.cluster.local:8123
    extraEgress:
      - namespace: kos-langwatch-hml
        ports:
          - { protocol: TCP, port: 8123 }

  billing-close-scheduler:
    envOverride:
      ENVIRONMENT: homolog
      MONGO_USAGE_DB_NAME: usage_db

jobs:
  migrations:
    envOverride:
      ENVIRONMENT: homolog
      MONGO_USAGE_DB_NAME: usage_db

cronjobs:
  backup:
    serviceAccount:
      irsaRoleArn: arn:aws:iam::701016785827:role/hv-kos-usage-backup-hml
    envOverride:
      MONGO_USAGE_DB_NAME: usage_db
      # RECONCILIADO 2026-08-23 (RECONCILIATION.md, topico 2): o nome CANONICO
      # do bucket e `hv-kos-usage-backups-<env>` — PLURAL. Nao e escolha de
      # gosto: e o nome que o `aws_s3_bucket` do modulo `kos-client-foundation`
      # (khal-infra, stream A) cria, provado no `tofu plan` (`BUCKET
      # hv-kos-usage-backups-<env>`), e e o unico ARN que a policy da role
      # `hv-kos-usage-backup-<env>` autoriza. Com o singular, o CronJob subiria
      # com a credencial certa e levaria AccessDenied num bucket que nao existe.
      # (A ROLE segue no singular `hv-kos-usage-backup-<env>`: e outro nome,
      # noutro namespace da AWS, e quem manda nele tambem e o Tofu.)
      BACKUP_BUCKET: hv-kos-usage-backups-hml
