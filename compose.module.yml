# THE MODULE — the platform's own services: api + ui. (The
# trace-ingestion-worker lives in compose.connector.yml: it scales with
# the connector, not with the module — one ingestor per LangWatch stack.)
#
# One client = one compose PROJECT assembled from role files (decision 65):
#
#   compose.module.yml     (this file — always)
#   compose.connector.yml  (the connector: LangWatch stack + its couplings)
#   compose.mongodb.yml    (the database: mongo + its couplings)
#   compose.dev.yml        (dev overlay: build blocks + demo fixtures)
#
#   docker compose -f compose.module.yml -f compose.connector.yml \
#     -f compose.mongodb.yml --env-file clients/<name>.env up -d
#
# (The Makefile wraps this chain; see clients/example.env for the env
# contract.) All files merge into ONE project — same network, DNS,
# volumes. Couplings live in the file that introduces them: this file
# never names a langwatch or mongo service, so swapping a connector or
# pointing at an external database is a change of FILES + env, not edits
# here. A future connector/store = a new compose.<name>.yml alongside.
#
# This file knows NO client: every client-specific value arrives via the
# env file. ${CLIENT_NAME:?...} makes a missing env file fail loudly
# instead of composing a half-named stack.

# Fallback project name = the client slug. Without this, an env file that
# forgets COMPOSE_PROJECT_NAME would fall back to the DIRECTORY name — and
# two such clients would silently collapse into one project sharing one
# mongo volume. COMPOSE_PROJECT_NAME from the env file still takes
# precedence when set.
name: ${CLIENT_NAME}

services:
  # `api` on purpose (decision 129): the service is named for its ROLE
  # (it serves /api/v1 — the name operators type), while `module` /
  # `platform-module` name the package/image it is built from. Not a
  # leftover from the pre-split layout — do not "fix" it.
  api:
    image: ${MODULE_IMAGE:-platform-module:local}
    container_name: ${CLIENT_NAME:?set CLIENT_NAME via --env-file (see clients/example.env)}-api
    init: true # not for signals (the app drains SIGTERM itself, C-5.4): PID-1 zombie reaping + backstop if node is ever shell-wrapped
    # audit G-4: the graceful HTTP drain (C-5.4) has the same 10s default
    # ceiling as mongo — give it room to finish in-flight requests.
    stop_grace_period: 30s
    environment:
      ENVIRONMENT: production
      SERVER_PORT: "3000"
      CLIENT_NAME: ${CLIENT_NAME} # brands the OpenAPI docs of this instance
      # Decision 130: REQUIRED — billing boundary ≡ display zone (IANA name).
      CLIENT_TIMEZONE: ${CLIENT_TIMEZONE:?set CLIENT_TIMEZONE in the client env (IANA, e.g. America/Sao_Paulo) — decision 130}
      # Host defaults to the in-project mongo (compose.mongodb.yml); an
      # external database = drop that file and set these in the env file.
      MONGO_DB_HOST: ${MONGO_DB_HOST:-mongo}
      MONGO_DB_PORT: ${MONGO_DB_PORT:-27017}
      MONGO_USAGE_DB_NAME: ${MONGO_USAGE_DB_NAME:?set MONGO_USAGE_DB_NAME in the client env (the usage store is declared, never inferred — decision 139)}
      MONGO_DB_USER: ${MONGO_DB_USER:-}
      MONGO_DB_PASSWORD: ${MONGO_DB_PASSWORD:-}
      # Atlas mode (decision 65): 'true' switches the connection to
      # mongodb+srv://<host> with TLS; MONGO_DB_PORT is ignored and the
      # Makefile drops compose.mongodb.yml from the chain.
      MONGO_DB_ATLAS: ${MONGO_DB_ATLAS:-}
      # khal platform (M2M auth) — forwarded from the client env, or the API
      # stays open (PoC behavior). Canonical surface (ADR-97): discovery +
      # tenant resolve the Auth System URL at runtime; the credential
      # authenticates /introspect. The `:-` default interpolates to EMPTY
      # when the env file omits/comments the var; environment-setup.ts treats
      # '' as unset, so an empty forward can never half-enable auth.
      KHAL_DISCOVERY_URL: ${KHAL_DISCOVERY_URL:-}
      KHAL_TENANT: ${KHAL_TENANT:-}
      KHAL_CLIENT_ID: ${KHAL_CLIENT_ID:-}
      KHAL_CLIENT_SECRET: ${KHAL_CLIENT_SECRET:-}
      # audit D-1: cross-origin is opt-in — exact origins, comma-separated;
      # empty = same-origin only (no CORS headers at all).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Decision 141: interim edge gate — both or neither (the env schema
      # refuses half a pair, and refuses coexistence with KHAL_*).
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      # Logging knobs (one shared reader in core, both images): empty means
      # the defaults — level info, json lines on stdout.
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
    ports:
      # Loopback by default: the API is auth-less until KHAL_DISCOVERY_URL
      # is set, and it serves the full unmasked archive. Exposing beyond
      # localhost is an explicit opt-in — API_BIND=0.0.0.0 + a firewall
      # (see clients/example.env).
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    healthcheck:
      # openapi.json is built in memory at startup — proves the process is up.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/docs/openapi.json"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  ui:
    image: ${UI_IMAGE:-platform-ui:local}
    container_name: ${CLIENT_NAME}-ui
    environment:
      CLIENT_NAME: ${CLIENT_NAME} # substituted into the nginx template (/client.json)
      CLIENT_TIMEZONE: ${CLIENT_TIMEZONE} # decision 130 — shown as the header zone label
    ports:
      # Same loopback default as the api. The UI is the client-facing
      # surface, so UI_BIND=0.0.0.0 is the override that may legitimately
      # be needed — still behind a firewall (the UI proxies the auth-less
      # API); see clients/example.env.
      - "${UI_BIND:-127.0.0.1}:${UI_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m

  # T6 continuous form (decision 131): the billing-close scheduler. Closes
  # every fully-past client-calendar month through the ONE close use case
  # (trigger 'scheduled'), oldest first, retrying a blocked month every
  # cycle (QA5: the bill waits). OPT-IN by compose profile: the service
  # only EXISTS when the client env sets COMPOSE_PROFILES=billing-auto-close
  # — absent knob, absent container (declared, never inferred; an always-on
  # service idling behind an env check would read healthy while doing
  # nothing). EXACTLY ONE replica — never scale: scaling is per-service, so
  # a future `--scale api=N` never touches this; the fixed container_name
  # makes compose refuse to scale it, same lock as the trace-ingestion-
  # worker. (Concurrent closes are safe anyway — guarded update + unique
  # index, one winner — a duplicate would only double-log.)
  billing-close-scheduler:
    profiles: ["billing-auto-close"]
    image: ${MODULE_IMAGE:-platform-module:local}
    container_name: ${CLIENT_NAME}-billing-close-scheduler
    command: ["node", "dist/main/jobs/run-billing-close-scheduler.js"]
    init: true # PID-1 reaping; the loop drains SIGTERM itself
    # An in-flight close should finish its current day-page + atomic
    # commit — default 10s is tight for a busy month on a busy host.
    stop_grace_period: 60s
    environment:
      ENVIRONMENT: production
      # Required by the module env schema (one schema, one reader) — the
      # scheduler never listens; same env the runbook jobs run under.
      SERVER_PORT: "3000"
      CLIENT_NAME: ${CLIENT_NAME}
      # Decision 130: the close cuts the month at the client midnight.
      CLIENT_TIMEZONE: ${CLIENT_TIMEZONE:?set CLIENT_TIMEZONE in the client env (IANA) — decision 130}
      MONGO_DB_HOST: ${MONGO_DB_HOST:-mongo}
      MONGO_DB_PORT: ${MONGO_DB_PORT:-27017}
      MONGO_USAGE_DB_NAME: ${MONGO_USAGE_DB_NAME:?set MONGO_USAGE_DB_NAME in the client env (the usage store is declared, never inferred — decision 139)}
      MONGO_DB_USER: ${MONGO_DB_USER:-}
      MONGO_DB_PASSWORD: ${MONGO_DB_PASSWORD:-}
      # Atlas mode (decision 65): 'true' switches the connection to
      # mongodb+srv://<host> with TLS; MONGO_DB_PORT is ignored and the
      # Makefile drops compose.mongodb.yml from the chain.
      MONGO_DB_ATLAS: ${MONGO_DB_ATLAS:-}
      # Defaults mirror SCHEDULER_DEFAULTS in billing-factory.ts.
      BILLING_AUTO_CLOSE_DELAY_MINUTES: ${BILLING_AUTO_CLOSE_DELAY_MINUTES:-60}
      BILLING_AUTO_CLOSE_CHECK_INTERVAL_SECONDS: ${BILLING_AUTO_CLOSE_CHECK_INTERVAL_SECONDS:-900}
      # Logging knobs — same shared reader as the api.
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
    healthcheck:
      # PROGRESS, not process existence (audit G-1): the loop touches
      # /tmp/billing-close-heartbeat after every COMPLETED evaluation cycle
      # (blocked included — a blocked close is a decision, not a wedge; see
      # billing-scheduler-heartbeat.ts — error paths deliberately don't
      # beat), so a hung Mongo socket ages the file and the container turns
      # unhealthy. Freshness window: 2×interval + 120s for a close in flight.
      test:
        [
          "CMD-SHELL",
          "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/billing-close-heartbeat 2>/dev/null || echo 0) )) -lt $$(( 2 * ${BILLING_AUTO_CLOSE_CHECK_INTERVAL_SECONDS:-900} + 120 ))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # First beat needs connect + one whole evaluation cycle (which may
      # include a full month close on catch-up) — generous on purpose.
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # NOT smaller than the api: idle footprint is tiny, but the
          # monthly close runs the SAME day-paged fold decision 120 sized
          # against a 512m container's ~259 MB heap — a smaller cap would
          # reintroduce the heap death, now in the automated path only.
          memory: 512m
