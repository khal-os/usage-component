# Decision 140: images are built ONCE per git SHA and every tenant runs the
# same tag. IMMUTABLE tags — rollback is redeploying an older SHA, never
# rebuilding. Decision 153: with one AWS account per client, "once" now means
# built once and PUSHED to N registries — never rebuilt per account, or the
# same commit would produce different bytes per client.
#
# The account list is deploy/tenants/*.env (AWS_ACCOUNT_ID in each), so
# onboarding a client is committing a file. No per-client GitHub variable
# exists: every role ARN is computed by naming.sh.
name: Publish images to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      # One failing image must not cancel the others; the deploy script's
      # ECR-existence guard is what decides deployability of a SHA.
      fail-fast: false
      matrix:
        # image = the naming.sh image axis; dockerfile = docker/<name>.Dockerfile.
        # db-backup carries no platform- prefix on purpose: it is the backup
        # of the tenant's usage DB, not of the platform.
        include:
          - { image: module, dockerfile: module }
          - { image: connector, dockerfile: connector }
          - { image: db-backup, dockerfile: usage-db-backup }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build ${{ matrix.image }} once
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build -f "docker/${DOCKERFILE}.Dockerfile" -t "local-build:${GITHUB_SHA}" .

      # No configure-aws-credentials here: that action assumes ONE role, and
      # this step assumes one per tenant account from a single OIDC token.
      - name: Push to every enabled tenant account
        env:
          IMAGE: ${{ matrix.image }}
        run: bash deploy/scripts/ecr-push-fleet.sh "$IMAGE" "local-build:${GITHUB_SHA}" "$GITHUB_SHA"
