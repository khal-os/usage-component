# PR-time image validation. build-images.yml builds & pushes to ECR only
# AFTER a merge to main — so a Dockerfile broken by a PR used to surface
# post-merge (it shipped twice: husky/prepare failures visible only in
# image builds). This lane builds every image on the PR itself, no push,
# and Trivy-scans the runtime images. deploy-smoke runs the docker-free
# deploy-script regression that previously only ran via `make deploy-smoke`.
name: Image build & scan

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One failing image must not hide breakage in the others.
      fail-fast: false
      matrix:
        # image = local tag; dockerfile = docker/<name>.Dockerfile. Same
        # pairs as build-images.yml — usage-db-backup has no platform-
        # prefix (it backs up the tenant's usage DB, not the platform).
        include:
          - { image: platform-module, dockerfile: module }
          - { image: platform-connector, dockerfile: connector }
          - { image: usage-db-backup, dockerfile: usage-db-backup }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/${{ matrix.dockerfile }}.Dockerfile
          push: false
          # load into the local daemon so Trivy can scan the result
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,scope=${{ matrix.dockerfile }},mode=max
      # Blocking on FIXABLE criticals only: a critical with a released fix
      # is actionable (bump the base image / dep); unfixed upstream CVEs
      # would block PRs on things no change here can address.
      # ignore-unfixed keys on the LIBRARY fix, though: a CVE fixed in a Go
      # module that NO release of the vendored binary ships yet counts as
      # "fixable" while being just as unactionable. Those get a DATED entry
      # in .trivyignore instead of a looser gate (decision 173).
      - name: Trivy — critical (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
      - name: Trivy — high (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '0'
          skip-setup-trivy: true
      # Feeds the docker dashboard (decision 146): image size + fixable
      # vuln counts, one small json per image.
      - name: Trivy — counts (json)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: json
          output: trivy.json
          exit-code: '0'
          skip-setup-trivy: true
      - name: Image metrics
        if: always()
        run: |
          mkdir -p image-metrics
          node -e '
            const fs = require("fs");
            let vulns = [];
            try {
              vulns = (JSON.parse(fs.readFileSync("trivy.json", "utf8")).Results || [])
                .flatMap((r) => r.Vulnerabilities || []);
            } catch {}
            const count = (s) => vulns.filter((v) => v.Severity === s).length;
            fs.writeFileSync(
              "image-metrics/${{ matrix.image }}.json",
              JSON.stringify({
                image: "${{ matrix.image }}",
                size: Number(process.argv[1]),
                critical: count("CRITICAL"),
                high: count("HIGH"),
              }),
            );
          ' "$(docker image inspect ${{ matrix.image }}:ci --format '{{.Size}}')"
      - name: Upload image metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-metrics-${{ matrix.image }}
          path: image-metrics/
          retention-days: 2
          if-no-files-found: ignore

  # Sticky PR comment #2 (decision 146): image sizes with delta vs main +
  # Trivy counts. Not a required check; skipped for dependabot/fork PRs.
  docker-dashboard:
    name: Docker dashboard
    needs: build
    if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci-metrics
          path: .ci-metrics
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: image-metrics-*
          merge-multiple: true
          path: image-metrics
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Build & upsert dashboard comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          METRICS_DIR: .ci-metrics
        run: |
          node scripts/docker-dashboard.mjs > .docker-dashboard.md
          cid=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate \
                -q '.[] | select(.body | startswith("<!-- docker-dashboard -->")) | .id' | head -n1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${cid}" -F body=@.docker-dashboard.md > /dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -F body=@.docker-dashboard.md > /dev/null
          fi

  # On every main build, append one image-metrics line to ci-metrics —
  # the size baseline the PR dashboard's deltas compare against.
  record-image-metrics:
    name: Record main image metrics
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci-metrics
          path: .ci-metrics
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-metrics-*
          merge-multiple: true
          path: image-metrics
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Append images line
        run: |
          node scripts/record-ci-metrics.mjs images > .line.json
          cd .ci-metrics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3; do
            git fetch origin ci-metrics
            git reset --hard FETCH_HEAD
            cat ../.line.json >> images.ndjson
            git add images.ndjson
            git commit -m "metrics: images @ ${GITHUB_SHA:0:7}" > /dev/null
            git push origin HEAD:ci-metrics && break
          done

  deploy-smoke:
    name: Deploy-script smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/deploy-smoke-test.sh
