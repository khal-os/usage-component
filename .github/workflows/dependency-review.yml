# Blocks a PR that ADDS a dependency with a known high/critical vuln
# (diff-based — existing deps are the nightly audit's job). PR-only by
# nature: it compares the PR's manifests against the base, so it is NOT a
# merge-queue required check.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
