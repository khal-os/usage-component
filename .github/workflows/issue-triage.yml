name: Issue triage
on:
  issues:
    types: [opened, reopened]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure triage label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "${{ github.event.issue.number }}" -R "${{ github.repository }}" --add-label triage
