# Manual, per-tenant deploy (decision 140): production changes when the
# operator says so — the button IS the checkpoint. Same mechanism as
# `make aws-deploy` (deploy/scripts/deploy-tenant.sh).
#
# The role is computed, not configured (decision 153): with one account per
# client there is no single AWS_DEPLOY_ROLE_ARN to hold, and a repository
# variable per client would be a second place for the account id to drift
# from deploy/tenants/<client>.env.
name: Deploy a tenant

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Tenant slug — must match deploy/tenants/<slug>.env"
        required: true
      sha:
        description: "Image SHA to deploy (a build-images tag; default: this commit)"
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.client }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Inputs reach the shell through env, never interpolated into a script
      # body: a crafted input would otherwise execute in a job that holds the
      # deploy role. naming.sh regex-validates the slug on top of that.
      - name: Resolve this tenant's role and region
        id: tenant
        env:
          CLIENT: ${{ inputs.client }}
        run: |
          source deploy/scripts/naming.sh
          tenant_load "$CLIENT"
          echo "role=arn:aws:iam::${AWS_ACCOUNT_ID}:role/$(name_role github-ci)" >> "$GITHUB_OUTPUT"
          echo "region=${TENANT_REGION}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ steps.tenant.outputs.role }}
          aws-region: ${{ steps.tenant.outputs.region }}

      - name: Deploy
        env:
          CLIENT: ${{ inputs.client }}
          SHA: ${{ inputs.sha || github.sha }}
        run: bash deploy/scripts/deploy-tenant.sh "$CLIENT" "$SHA"
