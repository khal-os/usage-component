# Manual, per-tenant deploy (decision 140): production changes when the
# operator says so — the button IS the checkpoint. Same mechanism as
# `make aws-deploy` (deploy/scripts/deploy-tenant.sh).
name: deploy-tenant

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Tenant slug (e.g. namastex)"
        required: true
      sha:
        description: "Image SHA to deploy (a build-images tag; default: this commit)"
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.client }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy
        # Inputs via env, never interpolated into the script body (review
        # fix: a crafted input would otherwise execute in a job holding
        # the deploy role); the script also regex-validates both.
        env:
          CLIENT: ${{ inputs.client }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          bash deploy/scripts/deploy-tenant.sh "$CLIENT" "$SHA"
