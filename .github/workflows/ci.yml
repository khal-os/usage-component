# CI for the observability component (module · connector · core).
#
# Mirrors the local gates exactly — pre-commit (lint-staged), commit-msg
# (commitlint) and pre-push (typecheck + lint + unit) are the fast local
# copies; this workflow is the authority: it also runs the integration
# suites (real Mongo via mongodb-memory-server), the coverage ratchet
# (audit E-5) and the packaging check.
#
# Actions are pinned to commit SHAs (supply-chain: a moved tag cannot
# change what runs here); Dependabot's github-actions ecosystem keeps
# the pins current. Node comes from .nvmrc — one place to bump.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue re-runs these checks on the speculative merge commit;
  # required checks must report on merge_group or the queue stalls.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Spec integrity (decision 137): decision-log numbering, RESOLVIDA
      # references, code decision/QA markers, Makefile SCRUB completeness.
      - run: node scripts/spec-check.mjs
      # The workflows themselves are prettier-ignored (YAML), so lint them
      # with actionlint — expression typos and invalid `uses:` fail here.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      # deploy/ is excluded from eslint, prettier, lint-staged and
      # spec-check, and nothing in this repo ran shellcheck at all — so the
      # scripts that GUARD every AWS deploy were the least-checked code in
      # the tree. Scoped to deploy/scripts at error severity: the older
      # scripts/*.sh would drown it in warnings on day one, and a lint that
      # is always noisy is a lint nobody reads.
      - name: shellcheck (deploy scripts)
        uses: docker://koalaman/shellcheck-alpine:v0.10.0
        with:
          entrypoint: sh
          args: -c "shellcheck --severity=error deploy/scripts/*.sh deploy/langwatch/*.sh"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Workspace typecheck resolves @observability/core through its exports
      # map (dist), so core must be built first — same order as local dev.
      - run: npm run build
      - run: npm run typecheck

  test:
    name: Build, packaging check & tests (unit + integration, coverage ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The integration suites boot mongodb-memory-server; cache the mongod
      # binary download between runs. Keyed on the jest-mongodb configs so a
      # mongod version bump gets a fresh cache; restore-keys still serves the
      # previous binary as a starting point.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('packages/*/jest-mongodb-config.js') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-
      - run: npm ci
      # build → packaging-check → per-workspace jest with coverage
      # thresholds (the ratchet: a coverage DROP fails this step).
      - run: npm run test:ci
      # Per-package coverage table + ratchet headroom in the run summary.
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: packages/*/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore
      # Feeds the PR dashboard (decision 146) and the main-metrics record.
      - name: Upload test metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-metrics
          path: |
            packages/*/coverage/coverage-summary.json
            packages/*/coverage/lcov.info
            packages/*/jest-results.json
          retention-days: 2
          if-no-files-found: ignore

  # Sticky PR comment (decision 146): coverage + deltas, trend, diff
  # coverage, tests, change map, decisions, timing. Never a required
  # check — the dashboard must never be the reason a PR can't merge.
  # Skipped for dependabot/fork PRs (their GITHUB_TOKEN is read-only).
  pr-dashboard:
    name: PR dashboard
    needs: test
    if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: the dashboard diffs against the PR base sha
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci-metrics
          path: .ci-metrics
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: test-metrics
          path: packages
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Collect job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > .ci-jobs.json
      - name: Build & upsert dashboard comment
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOBS_JSON: .ci-jobs.json
          METRICS_DIR: .ci-metrics
        run: |
          node scripts/pr-dashboard.mjs > .dashboard.md
          cid=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate \
                -q '.[] | select(.body | startswith("<!-- ci-dashboard -->")) | .id' | head -n1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${cid}" -F body=@.dashboard.md > /dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -F body=@.dashboard.md > /dev/null
          fi

  # On every main build, append one line to the ci-metrics branch — the
  # baseline the dashboard's deltas/trend/timing compare against.
  record-metrics:
    name: Record main metrics
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci-metrics
          path: .ci-metrics
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-metrics
          path: packages
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Collect job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > .ci-jobs.json
      - name: Append coverage line
        env:
          JOBS_JSON: .ci-jobs.json
        run: |
          node scripts/record-ci-metrics.mjs coverage > .line.json
          cd .ci-metrics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3; do
            git fetch origin ci-metrics
            git reset --hard FETCH_HEAD
            cat ../.line.json >> coverage.ndjson
            git add coverage.ndjson
            git commit -m "metrics: coverage @ ${GITHUB_SHA:0:7}" > /dev/null
            git push origin HEAD:ci-metrics && break
          done

  commitlint:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
      # Squash merges land the PR TITLE as the commit message on main, so
      # the title must be a conventional commit too. Via env, never inline —
      # a crafted title must not reach the shell as code.
      - name: Lint PR title (future squash commit)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
